<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar | Responsive</title>
    <link rel="stylesheet" href="navbar-responsive-style.css">

</head>
<body>
    
    <!-- Navbar Container -->
    <header>
        <nav class="wb-navbar-containers">

            <div class="Navbar-logotype">
                <a href="#">Design!</a>
            </div>

            <!-- Hamburger Button -->
            <div class="wb-hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <ul class="wb-navbar-ul">
                <li class="wb-navbar-li-actived"><a href="#">Home</a></li>
                <li class="wb-navbar-li"><a href="#">About</a></li>
                <li class="wb-navbar-li"><a href="#">Services</a></li>
                <li class="wb-navbar-li"><a href="#">Contact</a></li>
            </ul>

            <button class="wb-btn-login">
                <a class="wb-btn-login-a" href="#">Login</a>
            </button>

        </nav>

    </header>


    <script>
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.querySelector('.wb-navbar-ul');

        hamburger.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });
    </script>


</body>
</html>
